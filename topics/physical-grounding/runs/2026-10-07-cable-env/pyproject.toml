[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvidia-simlab"
version = "0.1.0"
description = "Offline simulation tasks, measured rollouts and simulation-only skill packs"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = ["mujoco==3.15.0", "numpy==2.5.3"]

[project.scripts]
dvidia-simlab = "simlab.cli:main"

[tool.setuptools.packages.find]
include = ["simlab*"]

[tool.setuptools.package-data]
simlab = ["requirements.lock.txt", "LICENSE"]
